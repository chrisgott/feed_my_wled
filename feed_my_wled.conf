[WLED]
# The IP address of the WLED device
WLED_IP_ADDRESS = 192.168.1.100

# The UDP port for the connection (default: 11988)
WLED_UDP_PORT = 11988

[Audio]
# The sample rate of the audio stream (default for Shairport is 88200)
sample_rate = 44100

# Set buffer_size equal to chunk_size to eliminate the Mac-specific audio delay!
buffer_size = 4096

# Reduced chunk_size to 4096 for a smoother ~21 FPS update rate
chunk_size = 4096

# Minimum frequency (Hz) for the audio-reactive FFT bands
min_frequency = 10

# Maximum frequency (Hz) for the audio-reactive FFT bands
max_frequency = 20000

# --- Auto-Gain Control (AGC) Settings ---

# Enable Automatic Gain Control (True/False). If False, a fixed max volume is used.
agc_enabled = False

# How aggressively the auto-gain recovers after a loud sound drops. 
# 0.0 = Instant (Chaotic), 0.99 = Very Slow (Preserves song dynamics)
agc_decay = 0.90

# Minimum volume threshold. Increase if silence/static still shows up as lit LEDs.
agc_noise_floor = 100000

# Fixed max volume if agc_enabled is False. (Scale is roughly 100000 to 30000000)
agc_fixed_max = 2000000
